name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: da59209c-1e97-488f-b5b8-49c6def9ed90
          tenant-id: 0768634a-2137-4f67-8033-8c0fb5a11851
          subscription-id: 51b841dc-d9c6-44eb-b6db-9c55cfd734db

      - name: Verify access
        run: az storage blob list --account-name briantinawiresume --container-name '$web' --auth-mode login --output table